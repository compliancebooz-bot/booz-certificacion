<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Certification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --bg:#F4F6F9; --surface:#FFFFFF; --ink:#16202B; --ink-soft:#5B6773;
    --blue:#1B4F8C; --blue-soft:#E8F0FA;
    --orange:#E8871E; --orange-soft:#FDEEDD; --orange-ink:#7A4A0A;
    --green:#157A4A; --green-soft:#E5F5EC;
    --red:#C1272D; --red-soft:#FBE9E9; --line:#DCE2E8; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{padding:18px 20px 14px;border-bottom:1px solid var(--line);background:var(--surface);}
  .brand{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--blue);}
  .brand span{color:var(--orange);}
  .stepper{display:flex;align-items:center;margin-top:14px;}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;width:74px;}
  .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:600;color:var(--ink-soft);transition:all .25s ease;}
  .step span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;text-align:center;}
  .step.active .dot{border-color:var(--orange);background:var(--orange);color:#fff;}
  .step.active span{color:var(--ink);font-weight:600;}
  .step.done .dot{border-color:var(--green);background:var(--green);color:#fff;}
  .step.done .dot::after{content:"✓";}
  .track{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px);margin:0 2px 18px;}
  main{flex:1;padding:26px 20px 40px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;
    display:inline-block;padding:3px 9px;border-radius:4px;font-weight:600;}
  h1{font-family:'Oswald',sans-serif;font-size:30px;line-height:1.08;margin:14px 0 8px;font-weight:600;}
  .lede{color:var(--ink-soft);font-size:15px;line-height:1.5;margin:0 0 26px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .btn{display:block;width:100%;text-align:center;border:none;border-radius:10px;padding:15px 18px;
    font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;
    transition:transform .12s ease,opacity .2s ease;-webkit-tap-highlight-color:transparent;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px;}
  .btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px;}
  .video-slot{background:#15171A;border-radius:var(--radius);aspect-ratio:9/16;max-height:420px;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:16px;}
  .video-slot iframe,.video-slot video{width:100%;height:100%;border:0;object-fit:cover;}
  .video-placeholder{color:#8A9098;text-align:center;padding:24px;font-size:13.5px;line-height:1.5;}
  .video-placeholder .play{width:52px;height:52px;border-radius:50%;background:var(--orange);margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;}
  .timer-note{text-align:center;font-size:13px;color:var(--ink-soft);margin:12px 0 18px;font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.05em;}
  .field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:9px;
    font-size:16px;font-family:'IBM Plex Sans',sans-serif;background:var(--surface);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--blue);}
  .q{margin-bottom:22px;}
  .q-title{font-size:15.5px;font-weight:600;margin-bottom:11px;line-height:1.4;}
  .opt{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:9px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;background:var(--surface);}
  .opt:hover{border-color:#AFC3DA;}
  .opt.selected{border-color:var(--blue);background:var(--blue-soft);}
  .opt-mark{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .opt.selected .opt-mark{border-color:var(--blue);background:var(--blue);}
  .opt.selected .opt-mark::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff;}
  .opt-text{font-size:14.5px;line-height:1.4;}
  .result-row{display:flex;gap:11px;padding:14px;border-radius:10px;margin-bottom:10px;}
  .result-row.ok{background:var(--green-soft);}
  .result-row.bad{background:var(--red-soft);}
  .result-icon{font-weight:700;font-size:15px;flex-shrink:0;}
  .result-row.ok .result-icon{color:var(--green);}
  .result-row.bad .result-icon{color:var(--red);}
  .result-text{font-size:13.5px;line-height:1.45;}
  .result-text b{display:block;margin-bottom:2px;}
  .cert-wrap{background:var(--surface);border-radius:var(--radius);padding:4px;margin-bottom:20px;
    box-shadow:0 2px 10px rgba(20,40,70,.08);}
  .cert{position:relative;border:3px double var(--blue);border-radius:6px;
    padding:32px 24px 22px;text-align:center;overflow:hidden;background:var(--surface);}
  .cert-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:0;}
  .cert-watermark img{width:68%;max-width:260px;opacity:.07;filter:grayscale(1);}
  .cert-content{position:relative;z-index:1;}
  .cert-heading{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
    color:var(--blue);text-transform:uppercase;font-weight:600;margin-bottom:4px;}
  .cert-company{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.1em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:18px;}
  .cert-rule{width:40px;height:2px;background:var(--orange);margin:0 auto 18px;}
  .cert-cat{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--ink-soft);
    text-transform:uppercase;margin-bottom:4px;}
  .cert-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;margin-bottom:20px;}
  .cert-otorgado{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;font-style:italic;}
  .cert-name{font-size:23px;font-weight:700;margin-bottom:2px;}
  .cert-badge{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
  .cert-divider{height:1px;background:var(--line);margin:0 0 14px;}
  .cert-score{font-size:13px;color:var(--ink);margin-bottom:10px;}
  .cert-score b{color:var(--blue);}
  .cert-meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;color:var(--ink-soft);}
  .muted{color:var(--ink-soft);font-size:13px;}
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

</div>

/* ============================================================ */

let STATE = { step:"intro", driver:{name:"",badge:""}, selected:[], certId:null, videoTimer:null, attempts:0, firstAttemptCorrectCount:null, attemptNotes:[] };
const STEPS = ["video","quiz","certificate"];
const $ = s => document.querySelector(s);
const esc = s => { const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; };

function categoryColors(cat){
  const map = {
    "Safety":     {bg:"var(--orange-soft)", fg:"var(--orange-ink)"},
    "Quality":    {bg:"var(--green-soft)",  fg:"var(--green)"},
    "Onboarding": {bg:"var(--blue-soft)",   fg:"var(--blue)"}
  };
  return map[cat] || {bg:"#EEE", fg:"var(--ink-soft)"};
}

document.title = CONFIG.companyName + " · Certificación";
$("#brandText").innerHTML = `${esc(CONFIG.companyName)}<span>·</span>CERTIFICATION`;
if (CONFIG.emailjs.publicKey && window.emailjs){
  emailjs.init({ publicKey: CONFIG.emailjs.publicKey });
}

function updateStepper(active){
  const idx = STEPS.indexOf(active);
  $("#stepper").innerHTML = STEPS.map((s,i)=>{
    const label = s==="video"?"Video":s==="quiz"?"Quiz":"Certificate";
    const cls = i<idx ? "step done" : i===idx ? "step active" : "step";
    const track = i < STEPS.length-1 ? '<div class="track"></div>' : "";
    return `<div class="${cls}"><div class="dot">${i+1}</div><span>${label}</span></div>${track}`;
  }).join("");
}

function render(){
  if (STATE.step==="intro") renderIntro();
  else if (STATE.step==="video") renderVideo();
  else if (STATE.step==="quiz") renderQuiz();
  else if (STATE.step==="result") renderResult();
  else if (STATE.step==="certificate") renderCertificate();
  updateStepper(STATE.step==="intro"?"video":STATE.step==="result"?"quiz":STATE.step);
}

function renderIntro(){
  const c = categoryColors(CONFIG.category);
  $("#main").innerHTML = `
    <span class="eyebrow" style="background:${c.bg};color:${c.fg};">${esc(CONFIG.category.toUpperCase())} · SHORT MODULE</span>
    <h1>${esc(CONFIG.titleEs)}</h1>
    <p class="lede">A short video and ${CONFIG.questions.length} questions. Less than 2 minutes, and you'll get your certificate.</p>
    <button class="btn btn-primary" onclick="goVideo()">Start</button>
  `;
}

function goVideo(){ STATE.step="video"; render(); startVideoTimer(); }

function videoEmbed(){
  if (CONFIG.youtubeId) return `<iframe src="https://www.youtube.com/embed/${CONFIG.youtubeId}?rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  if (CONFIG.videoUrl) return `<video src="${CONFIG.videoUrl}" controls playsinline></video>`;
  return `<div class="video-placeholder"><div class="play">▶</div>Your video goes here (20–60 sec).<br>Set <b>youtubeId</b> or <b>videoUrl</b> above in CONFIG.</div>`;
}

function renderVideo(){
  $("#main").innerHTML = `
    <h1 style="font-size:22px;">${esc(CONFIG.titleEs)}</h1>
    <div class="video-slot">${videoEmbed()}</div>
    <div class="timer-note" id="timerNote">Continue in ${CONFIG.minSecondsBeforeContinue}s…</div>
    <button class="btn btn-primary" id="continueBtn" disabled onclick="goQuiz()">I watched the video, continue</button>
  `;
}

function startVideoTimer(){
  let left = CONFIG.minSecondsBeforeContinue;
  clearInterval(STATE.videoTimer);
  STATE.videoTimer = setInterval(()=>{
    left--;
    const note = $("#timerNote"), btn = $("#continueBtn");
    if (!note || !btn) { clearInterval(STATE.videoTimer); return; }
    if (left<=0){ note.textContent="Ready."; btn.disabled=false; clearInterval(STATE.videoTimer); }
    else note.textContent = `Continue in ${left}s…`;
  },1000);
}

function goQuiz(){ STATE.step="quiz"; if(STATE.selected.length===0) STATE.selected = new Array(CONFIG.questions.length).fill(null); render(); }

function renderQuiz(){
  const qHtml = CONFIG.questions.map((q,qi)=>`
    <div class="q">
      <div class="q-title">${qi+1}. ${esc(q.q)}</div>
      ${q.options.map((opt,oi)=>`
        <div class="opt ${STATE.selected[qi]===oi?'selected':''}" onclick="selectOpt(${qi},${oi})">
          <div class="opt-mark"></div><div class="opt-text">${esc(opt)}</div>
        </div>`).join("")}
    </div>`).join("");
  $("#main").innerHTML = `
    <h1 style="font-size:22px;">Before your certificate</h1>
    <p class="lede">Enter your name and answer the questions.</p>
    <div class="field"><label>Full name</label>
      <input id="fName" type="text" placeholder="Your name" value="${esc(STATE.driver.name)}"
        autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" name="driver-name-field"
        readonly onfocus="this.removeAttribute('readonly')"></div>
    ${qHtml}
    <button class="btn btn-primary" onclick="submitQuiz()">Submit answers</button>
  `;
}

// Guarda lo que ya se había escrito antes de re-pintar la pantalla
// al elegir una opción — esto es lo que antes borraba el nombre.
function syncDriverFields(){
  const fName = $("#fName");
  if (fName) STATE.driver.name = fName.value;
}

function selectOpt(qi,oi){ syncDriverFields(); STATE.selected[qi]=oi; renderQuiz(); }

function submitQuiz(){
  STATE.driver.name = $("#fName").value.trim();
  if (!STATE.driver.name){ alert("Name is required."); return; }
  if (STATE.selected.some(s=>s===null)){ alert("Please answer all the questions."); return; }
  STATE.attempts++;
  // Nota interna (solo para ti, nunca se muestra al driver): en qué
  // número de pregunta falló, en CADA intento (no solo el primero).
  const wrongNums = CONFIG.questions
    .map((q,i)=> STATE.selected[i]!==q.correct ? (i+1) : null)
    .filter(n => n !== null);
  if (STATE.firstAttemptCorrectCount===null){
    STATE.firstAttemptCorrectCount = CONFIG.questions.length - wrongNums.length;
  }
  const attemptLabel = wrongNums.length === 0
    ? "sin errores"
    : (wrongNums.length === 1 ? `falló la pregunta ${wrongNums[0]}` : `falló las preguntas ${wrongNums.join(", ")}`);
  STATE.attemptNotes.push(`Intento ${STATE.attempts}: ${attemptLabel}`);
  STATE.step="result"; render();
}

function renderResult(){
  const wrong = CONFIG.questions.map((q,i)=>({q,i})).filter(x=>STATE.selected[x.i]!==x.q.correct);
  if (wrong.length===0){
    STATE.step="certificate"; render(); logCompletion(); return;
  }
  const rows = CONFIG.questions.map((q,i)=>{
    const ok = STATE.selected[i]===q.correct;
    return `<div class="result-row ${ok?'ok':'bad'}">
      <div class="result-icon">${ok?'✓':'✕'}</div>
      <div class="result-text"><b>${esc(q.q)}</b>${ok?'Correct.':'Correct answer: '+esc(q.options[q.correct])+' — '+esc(q.explain)}</div>
    </div>`;
  }).join("");
  $("#main").innerHTML = `
    <h1 style="font-size:22px;">Review this before you get certified</h1>
    <p class="lede">${wrong.length} of ${CONFIG.questions.length} to review.</p>
    ${rows}
    <button class="btn btn-primary" onclick="goQuiz()">Retry quiz</button>
  `;
}

function genCertId(){
  return "CERT-"+Date.now().toString(36).toUpperCase();
}

function renderCertificate(){
  if (!STATE.certId) STATE.certId = genCertId();
  const date = new Date().toLocaleDateString("es-US",{year:"numeric",month:"2-digit",day:"2-digit"});
  const pct = Math.round((STATE.firstAttemptCorrectCount / CONFIG.questions.length) * 100);
  const attemptsNote = STATE.attempts>1
    ? ` (first attempt: ${pct}%, ${STATE.attempts} attempts)`
    : ` (passed on first attempt)`;
  const watermark = CONFIG.logoDataUrl
    ? `<div class="cert-watermark"><img src="${CONFIG.logoDataUrl}" alt=""></div>`
    : "";
  $("#main").innerHTML = `
    <h1 style="font-size:22px;">Certificate issued</h1>
    <div class="cert-wrap">
      <div class="cert" id="certificateCard">
        ${watermark}
        <div class="cert-content">
          <div class="cert-heading">Certificate of Completion</div>
          <div class="cert-company">${esc(CONFIG.companyName)}</div>
          <div class="cert-rule"></div>
          <div class="cert-cat">${esc(CONFIG.category)}</div>
          <div class="cert-title">${esc(CONFIG.titleEs)}</div>
          <div class="cert-otorgado">Awarded to</div>
          <div class="cert-name">${esc(STATE.driver.name)}</div>
          <div class="cert-divider"></div>
          <div class="cert-score">Score: <b>100%</b>${attemptsNote}</div>
          <div class="cert-meta"><span>${date}</span><span>${STATE.certId}</span></div>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="downloadCertificate()">Download certificate</button>
    <a class="btn btn-ghost" href="index.html" style="display:block;text-decoration:none;box-sizing:border-box;">Back to home</a>
  `;
}

async function downloadCertificate(){
  const node = $("#certificateCard");
  const canvas = await html2canvas(node,{scale:2,backgroundColor:"#FFFFFF"});
  const a = document.createElement("a");
  a.download = `certificado_${STATE.certId}.png`;
  a.href = canvas.toDataURL("image/png");
  a.click();
}

async function logCompletion(){
  const pct = Math.round((STATE.firstAttemptCorrectCount / CONFIG.questions.length) * 100);
  const now = new Date();
  const dateNoSlash = String(now.getDate()).padStart(2,"0") + "-" +
    String(now.getMonth()+1).padStart(2,"0") + "-" + now.getFullYear();
  const record = {
    id: STATE.certId || genCertId(),
    company: CONFIG.companyName,
    module: CONFIG.titleEs,
    category: CONFIG.category,
    name: STATE.driver.name,
    badge: STATE.driver.badge || "-",
    firstAttemptPct: pct,
    attempts: STATE.attempts,
    date: dateNoSlash,
    notes: STATE.attemptNotes.join(" / "),
    ts: Date.now()
  };
  STATE.certId = record.id;
  if (CONFIG.emailjs.serviceId && CONFIG.emailjs.templateId && window.emailjs){
    const subjectLine = ["CERT", record.company, record.module, record.category,
      record.name, record.badge, record.firstAttemptPct, record.attempts, record.id, record.date,
      record.notes].join("|");
    try{
      await emailjs.send(CONFIG.emailjs.serviceId, CONFIG.emailjs.templateId, {
        subject_line: subjectLine, company: record.company, module: record.module,
        category: record.category, name: record.name, badge: record.badge,
        pct: record.firstAttemptPct, attempts: record.attempts, id: record.id, date: record.date
      });
    }catch(e){ console.warn("No se pudo enviar el correo:",e); }
  }
}

render();
</script>
